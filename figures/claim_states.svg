<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="875" height="300" font-family="'IBM Plex Mono', monospace">
  <style>
    .fg { fill: #1a1a2e; }
    .fg-stroke { stroke: #1a1a2e; }
    .accent { fill: #c23616; }
    .accent-stroke { stroke: #c23616; }
    .arr-fill { fill: #1a1a2e; }
    .card-bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #d4d4dc; }
      .fg-stroke { stroke: #d4d4dc; }
      .accent { fill: #e8664a; }
      .accent-stroke { stroke: #e8664a; }
      .arr-fill { fill: #d4d4dc; }
      .card-bg { fill: #1a1a2e; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arr-fill"/>
    </marker>
  </defs>

  <!-- states: red holds the resource, grey holds nothing and has ended -->
  <text x="65" y="104" font-size="11" class="fg" text-anchor="middle">pending</text>
  <text x="265" y="104" font-size="11" class="accent" text-anchor="middle">granted</text>
  <text x="645" y="24" font-size="10" class="fg" text-anchor="middle" opacity="0.6">closed</text>
  <text x="645" y="52" font-size="11" class="accent" text-anchor="middle">acted</text>
  <text x="645" y="104" font-size="11" class="fg" text-anchor="middle" opacity="0.45">expired</text>
  <text x="645" y="168" font-size="11" class="fg" text-anchor="middle" opacity="0.45">released</text>
  <text x="645" y="222" font-size="11" class="fg" text-anchor="middle" opacity="0.45">lost</text>

  <!-- a pending intent can end with no recorded state -->
  <line x1="65" y1="90" x2="65" y2="58" class="fg-stroke" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="65" cy="49" r="7" fill="none" class="fg-stroke" stroke-width="1.5" opacity="0.45"/>
  <circle cx="65" cy="49" r="3.5" class="fg" opacity="0.45"/>
  <text x="75" y="74" font-size="10" class="fg">TTL · superseded</text>

  <!-- pending -> granted -->
  <line x1="94" y1="100" x2="234" y2="100" class="fg-stroke" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="164" y="93" font-size="10" class="fg" text-anchor="middle">grant <tspan fill-opacity="0.45" font-size="9">G3 G4 G5</tspan></text>

  <!-- granted -> closed -->
  <line x1="294" y1="100" x2="330" y2="100" class="fg-stroke" stroke-width="1.5"/>
  <line x1="330" y1="48" x2="330" y2="158" class="fg-stroke" stroke-width="1.5"/>
  <line x1="330" y1="48" x2="614" y2="48" class="fg-stroke" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="41" font-size="10" class="fg" text-anchor="middle">action</text>
  <line x1="330" y1="100" x2="614" y2="100" class="fg-stroke" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="93" font-size="10" class="fg" text-anchor="middle">expiry <tspan fill-opacity="0.45" font-size="9">G7</tspan></text>
  <line x1="330" y1="158" x2="608" y2="158" class="fg-stroke" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="151" font-size="10" class="fg" text-anchor="middle">failed action · superseded · principal <tspan fill-opacity="0.45" font-size="9">G5 G6</tspan></text>

  <!-- pending -> released, lost -->
  <polyline points="80,110 80,170 608,170" fill="none" class="fg-stroke" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="163" font-size="10" class="fg" text-anchor="middle">principal <tspan fill-opacity="0.45" font-size="9">G5</tspan></text>
  <polyline points="50,110 50,218 626,218" fill="none" class="fg-stroke" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="211" font-size="10" class="fg" text-anchor="middle">refused · beaten · held action <tspan fill-opacity="0.45" font-size="9">G3 G4</tspan></text>
</svg>
