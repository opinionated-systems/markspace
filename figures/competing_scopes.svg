<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 175" width="400" height="219" font-family="'IBM Plex Mono', monospace">
  <style>
    .fg { fill: #1a1a2e; }
    .fg-stroke { stroke: #1a1a2e; }
    .accent { fill: #c23616; }
    .accent-stroke { stroke: #c23616; }
    .arr-fill { fill: #1a1a2e; }
    .card-bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #d4d4dc; }
      .fg-stroke { stroke: #d4d4dc; }
      .accent { fill: #e8664a; }
      .accent-stroke { stroke: #e8664a; }
      .arr-fill { fill: #d4d4dc; }
      .card-bg { fill: #1a1a2e; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arr-fill"/>
    </marker>
  </defs>

  <!-- the competing set: the intent's scope, its ancestors and its descendants -->
  <polygon points="32,22 96,22 96,62 150,62 150,102 212,102 212,128 132,128 132,88 82,88 82,48 32,48" class="fg" opacity="0.07"/>
  <text x="218" y="120" font-size="10" class="fg">competing set</text>

  <!-- tree -->
  <polyline points="46,44 46,155 84,155" fill="none" class="fg-stroke" stroke-width="1.5" opacity="0.35"/>
  <line x1="46" y1="75" x2="84" y2="75" class="fg-stroke" stroke-width="1.5" opacity="0.35"/>
  <polyline points="96,84 96,115 134,115" fill="none" class="fg-stroke" stroke-width="1.5" opacity="0.35"/>

  <text x="40" y="40" font-size="11" class="fg">corp</text>
  <text x="90" y="80" font-size="11" class="fg">corp/a</text>
  <text x="140" y="120" font-size="11" class="fg">corp/a/x</text>
  <text x="90" y="160" font-size="11" class="fg" opacity="0.45">corp/b</text>

  <!-- an intent written in corp/a -->
  <line x1="206" y1="76" x2="142" y2="76" class="fg-stroke" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="212" y="80" font-size="10" class="fg">intent</text>
</svg>
