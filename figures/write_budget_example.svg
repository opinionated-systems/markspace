<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="850" height="327" font-family="'IBM Plex Mono', monospace">
  <style>
    .fg { fill: #1a1a2e; }
    .fg-stroke { stroke: #1a1a2e; }
    .bg { fill: #1a1a2e; }
    .accent { fill: #c23616; }
    .accent-stroke { stroke: #c23616; }
    .arr-fill { fill: #1a1a2e; }
    .arr-accent { fill: #c23616; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #d4d4dc; }
      .fg-stroke { stroke: #d4d4dc; }
      .bg { fill: #d4d4dc; }
      .accent { fill: #e8664a; }
      .accent-stroke { stroke: #e8664a; }
      .arr-fill { fill: #d4d4dc; }
      .arr-accent { fill: #e8664a; }
    }
  </style>
  <text x="66.0" y="20" font-size="11" font-weight="500" class="fg">An agent that declares 10 observations an hour: writes counted over 30 days</text>
  <line x1="66.0" y1="226.0" x2="546.0" y2="226.0" class="fg-stroke" stroke-width="1" opacity="0.4"/>
  <line x1="66.0" y1="226.0" x2="66.0" y2="40.0" class="fg-stroke" stroke-width="1" opacity="0.4"/>
  <text x="66.0" y="240.0" font-size="9" class="fg" opacity="0.6" text-anchor="middle">day 0</text>
  <text x="226.0" y="240.0" font-size="9" class="fg" opacity="0.6" text-anchor="middle">day 10</text>
  <text x="386.0" y="240.0" font-size="9" class="fg" opacity="0.6" text-anchor="middle">day 20</text>
  <text x="546.0" y="240.0" font-size="9" class="fg" opacity="0.6" text-anchor="middle">day 30</text>
  <text x="60.0" y="145.3" font-size="9" class="fg" opacity="0.6" text-anchor="end">7,200</text>
  <text x="60.0" y="61.6" font-size="9" class="fg" opacity="0.6" text-anchor="end">14,400</text>
  <text x="60.0" y="229.0" font-size="9" class="fg" opacity="0.6" text-anchor="end">0</text>
  <line x1="66.0" y1="58.6" x2="546.0" y2="58.6" class="fg-stroke" stroke-width="1" opacity="0.45"/>
  <text x="98.0" y="52.6" font-size="9" class="fg">budget: twice the declared rate</text>
  <line x1="66.0" y1="226.0" x2="546.0" y2="142.3" class="fg-stroke" stroke-width="1.5"/>
  <line x1="66.0" y1="226.0" x2="546.0" y2="100.5" class="fg-stroke" stroke-width="1.5"/>
  <polyline points="66.0,226.0 386.0,58.6 546.0,58.6" fill="none" class="accent-stroke" stroke-width="2"/>
  <polyline points="66.0,226.0 90.0,58.6 386.0,58.6" fill="none" class="accent-stroke" stroke-width="2"/>
  <circle cx="90.0" cy="58.6" r="4" class="accent"/>
  <circle cx="386.0" cy="58.6" r="4" class="accent"/>
  <text x="107.6" y="76.0" font-size="9" class="fg">400 an hour: page in the first hour,</text>
  <text x="107.6" y="87.0" font-size="9" class="fg">refused from day 1.5 to day 30</text>
  <text x="384.0" y="41.6" font-size="9" class="fg">30 an hour: ticket on day 2,</text>
  <text x="384.0" y="52.6" font-size="9" class="fg">refused from day 20 to day 30</text>
  <text x="552.0" y="103.5" font-size="9" class="fg">15 an hour:</text>
  <text x="552.0" y="114.5" font-size="9" class="fg" opacity="0.6">no alert, no refusal</text>
  <text x="552.0" y="145.3" font-size="9" class="fg">10 an hour:</text>
  <text x="552.0" y="156.3" font-size="9" class="fg" opacity="0.6">half the budget</text>
</svg>
